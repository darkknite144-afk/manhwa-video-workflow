name: Build Manhwa Short

on:
  workflow_dispatch:

  push:
    paths:
      - "assets/**"
      - "scripts/**"
      - "config/**"
      - "requirements.txt"
      - ".github/workflows/build-video.yml"

jobs:
  build-video:

    runs-on: ubuntu-latest

    timeout-minutes: 30

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare directories
        run: |
          mkdir -p data
          mkdir -p output

      - name: Transcribe audio
        run: |
          python scripts/transcribe.py

      - name: AI Scene Matching
        run: |
          python scripts/ai_scene_match.py

      - name: Match scenes
        run: |
          python scripts/match_scenes.py

      - name: Generate timeline
        run: |
          python scripts/generate_timeline.py

      - name: Render video
        run: |
          python scripts/render.py

      - name: Upload final video
        uses: actions/upload-artifact@v4
        with:
          name: manhwa-short
          path: output/final_manhwa_short.mp4
          if-no-files-found: error

      - name: Upload project data
        uses: actions/upload-artifact@v4
        with:
          name: manhwa-project-data
          path: |
            data/transcript.json
            data/scenes.json
            data/scenes_ai.json
            data/timeline.json
